<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptCrafter - AI Prompt Builder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="navbar glass-panel">
        <div class="logo">PromptCrafter ✨</div>
        <ul class="nav-links">
            <li><a href="#" data-target="home" class="active">Home</a></li>
            <li><a href="#" data-target="builder">Builder</a></li>
            <li><a href="#" data-target="library">Library</a></li>
        </ul>
    </nav>

    <main class="container">
        <!-- Home Section -->
        <section id="home" class="page-section active glass-panel">
            <h1>Craft the <span class="highlight">Perfect Prompt</span></h1>
            <p>AI에게 최고의 답변을 이끌어내기 위한 최적의 프롬프트를 1분 만에 조립하세요.</p>
            <button class="btn-primary" id="start-btn">시작하기</button>
        </section>

        <!-- Builder Section -->
        <section id="builder" class="page-section glass-panel">
            <h2>프롬프트 만들기</h2>
            <div class="builder-grid">
                <div class="form-group">
                    <label>누구에게 질문하나요? (역할)</label>
                    <select id="role">
                        <option value="전문가">분야 전문가</option>
                        <option value="개발자">시니어 개발자</option>
                        <option value="마케터">디지털 마케터</option>
                        <option value="선생님">친절한 선생님</option>
                        <option value="번역가">전문 번역가</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>무엇을 하고 싶나요? (목적)</label>
                    <input type="text" id="task" placeholder="예: 대학 과제용 에세이 작성, 파이썬 코드 디버깅 등" value="리액트로 할 일 관리 앱 만들기">
                </div>
                <div class="form-group">
                    <label>어조 (Tone)</label>
                    <select id="tone">
                        <option value="전문적이고 논리적인">전문적인</option>
                        <option value="쉽고 친절한">친절한</option>
                        <option value="창의적이고 재치있는">창의적인</option>
                        <option value="객관적이고 간결한">간결한</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>출력 형식 (Format)</label>
                    <select id="format">
                        <option value="마크다운 형태">마크다운</option>
                        <option value="글머리 기호(Bullet points)">글머리 기호</option>
                        <option value="표(Table) 형태">표</option>
                        <option value="짧은 요약문">요약문</option>
                    </select>
                </div>
            </div>
            
            <div class="result-container">
                <h3>생성된 프롬프트:</h3>
                <textarea id="result-prompt" readonly></textarea>
                <div class="action-buttons">
                    <button id="copy-btn" class="btn-secondary">📋 복사하기</button>
                    <button id="save-btn" class="btn-primary">💾 라이브러리에 저장</button>
                </div>
            </div>
        </section>

        <!-- Library Section -->
        <section id="library" class="page-section glass-panel">
            <h2>내 프롬프트 보관함</h2>
            <div id="library-list" class="library-grid">
                <!-- Saved items will appear here -->
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
